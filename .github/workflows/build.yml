name: Build MyCoder Universal v2.1 FIXED

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - run: pyinstaller --onefile --noconsole --name MyCoder-Universal main.py
    - uses: actions/upload-artifact@v4
      with:
        name: MyCoder-Universal-v2.1-FIXED-by-Masum
        path: dist/MyCoder-Universal.exe
        retention-days: 30